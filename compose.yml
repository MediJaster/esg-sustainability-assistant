services:
  crew:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.crew
    ports:
      - "80:8080"
    env_file:
      - .env

  streamlit:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.streamlit
    network_mode: "host"
    environment:
      - STREAMLIT_API_HOST=http://localhost:8080